<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Sunrise Animation</title>
    <style>
      html,
      body {
        margin: 0;
        background: rgba(255, 255, 255, 0);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
        overflow: hidden;
        position: fixed;
      }
      .path-svg.mobile {
        display: none;
      }
      img {
        -moz-window-dragging: no-drag;
        user-select: none;
      }
      .bg {
        position: absolute;
        inset: 0;
        background: url(bg.jpg);
        background-repeat: repeat-x;
        background-size: 120% 100%;
        background-position: top center;
        z-index: 2;
        transition:
          opacity 0.4s ease-out,
          filter 0.4s ease-out;
        inset: 0;
      }
      .bg-white {
        background-color: #fff;
        position: absolute;
        z-index: 1;
        top: 0;
        width: 100%;
        height: 100%;
      }
      .cloud {
        position: absolute;
        inset: 0;
        background: url(cloud.png);
        background-repeat: no-repeat;
        background-size: 100% auto;
        background-position: bottom center;
        z-index: 3;
      }
      .stage {
        position: absolute;
        width: min(100vw, 177.78vh);
        height: min(56.25vw, 100vh);
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 4;
        cursor: pointer;
      }
      .scene {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .sun {
        position: absolute;
        width: 450px;
        left: 0;
        top: 0;
        transform: translate(-100%, 50%);
        z-index: 1;
      }
      .path-svg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .path-svg path {
        stroke: none;
        fill: none;
      }
      #frame1 {
        width: auto;
        height: 90%;
      }

      .reveal-stack {
        position: absolute;
        top: 14vh;
        left: 0;
        right: 0;
        margin: auto;
        width: fit-content;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2vh;
      }

      .reveal-wrap {
        position: relative;
        width: 20vw;
        height: auto;
        aspect-ratio: 260 / 478;
        max-width: 260px;
        max-height: 478px;
        cursor: pointer;
        opacity: 0;
        z-index: 4;
      }

      .frame1-text {
        position: relative;
        width: auto;
        height: 5vh;
        max-height: 60px;
        opacity: 0;
      }

      .frame1-cta {
        position: relative;
        max-width: 250px;
        opacity: 0;
      }
      .reveal-wrap img {
        position: absolute;
      }
      .real-img {
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      .cover {
        width: 100%;
        height: 100%;
        clip-path: inset(0% 0% 0% 0%);
        z-index: 2;
        transition:
          clip-path 0.7s cubic-bezier(0.65, 0, 0.35, 1),
          opacity 0.4s ease;
      }
      .frame2-text1 {
        position: absolute;
        width: 50vw;
        height: auto;
        max-width: 500px;
        opacity: 0;
        margin: auto;
        top: 25%;
        left: 40%;
      }
      .frame2-text2 {
        position: absolute;
        width: 50vw;
        height: auto;
        max-width: 500px;
        opacity: 0;
        margin: auto;
        top: 25%;
        left: 40%;
      }
      #catfish {
        width: 100vw;
        height: 200px;
        position: fixed;
        bottom: 0;
        left: 0;
        z-index: 1000;
        background-image: url(normal-bg.png);
        background-position: bottom center;
        background-repeat: repeat-x;
        background-size: auto 140px;
        transform: translate(0, 100vh);
      }
      #catfish .content {
        width: 100%;
        height: 100%;
        max-width: 1100px;
        position: relative;
        margin: auto;
        left: 0;
        right: 0;
        display: flex;
        align-items: flex-start;
        z-index: 2;
      }
      #catfish #weather {
        background-image: url(temp-bg.png);
        background-position: center;
        background-repeat: no-repeat;
        background-size: 100% auto;
        aspect-ratio: 356/222;
        width: 22%;
        margin-top: 56px;
        margin-left: 2%;
        display: flex;
        align-items: center;
      }
      #catfish #weather img {
        width: 28%;
        height: auto;
        max-width: 80px;
        margin: 10% 0 0 15%;
      }
      #catfish #weather div {
        color: #db8000;
        font-size: 46px;
        margin: 11% 0 0 9%;
        letter-spacing: -1px;
      }
      #catfish #weather div sup {
        font-size: 24px;
      }
      #catfish .logo {
        width: 10%;
        height: auto;
        margin-top: 70px;
      }
      #catfish #text {
        width: 44%;
        height: 28%;
        padding-top: 86px;
        position: relative;
      }
      #catfish #text img {
        width: 100%;
        height: auto;
        position: absolute;
      }
      #catfish .catfishProdcut {
        width: auto;
        height: 106%;
        margin-top: -1%;
      }
      #closeBtn {
        background-image: url(closebtn.png);
        width: 40px;
        height: 40px;
        background-size: 30px 30px;
        background-repeat: no-repeat;
        z-index: 999;
        position: absolute;
        left: 10%;
        top: 44px;
      }
      #catfishClick {
        width: 100%;
        height: 100%;
        position: absolute;
        z-index: 3;
        left: 0;
        right: 0;
      }
      .sun-screen-layer {
        position: absolute;
        height: 56%;
        mix-blend-mode: screen;
        top: -20vh;
        left: 32vw;
        z-index: 2;
        opacity: 0;
        pointer-events: none;
      }
      .heat {
        position: fixed;
        inset: 0;
        background: url(bg.jpg) repeat-x top center / auto 100%;
        z-index: 3;
        opacity: 0;
        pointer-events: none;
      }
      .wave {
        position: fixed;
        z-index: 4;
        /* animation: floatX 7s ease-in-out infinite alternate; */
        /* background: url(wave.png) repeat-x top center / auto 100%; */
        pointer-events: none;
        width: 200%;
        height: 80%;
        left: -50%;
        top: -30%;
        opacity: 0.5;
      }
      #splash-container {
        width: 40vw;
        height: 100%;
        position: absolute;
        margin: auto;
        left: 0;
        right: 0;
        top: 0;
        z-index: 1;
        pointer-events: none;
        max-width: 400px;
      }
      .splash {
        position: absolute;
        pointer-events: none;
        transform-origin: center center;
        animation: splashAnim var(--dur) ease-out forwards;
      }
      @keyframes splashAnim {
        0% {
          opacity: 0;
          transform: var(--t) scale(0.3);
        }
        15% {
          opacity: 0.9;
          transform: var(--t) scale(0.6);
        }
        100% {
          opacity: 0;
          transform: var(--t) scale(1.15);
        }
      }
       #closeBigBtn {
          position: absolute;
          top: 2vh;
          right: 1vw;
          width: 40px;
          height: 40px;
          background: url(closebtn.png) no-repeat center /40px 40px;
          z-index: 9999;
          cursor: pointer;
          opacity:0;
        }
      @media (-webkit-min-device-pixel-ratio: 1.5), (min-resolution: 144dpi) {
        .reveal-wrap {
          width: clamp(120px, 15vw, 260px);
        }
        .sun {
          width: clamp(180px, 39%, 380px);
        }
        .frame2-text1,
        .frame2-text2 {
          width: 29vw;
          top: 20%;
        }
        #catfish .content {
          max-width: 900px;
        }
        #catfish #weather {
          margin-top: 70px;
        }
        #catfish #text {
          padding-top: 90px;
        }
        #catfish .logo {
          margin-top: 80px;
        }
        #catfish #weather div {
          font-size: 35px;
          margin: 10% 0 0 9%;
        }
        #catfish #weather div sup {
          font-size: 20px;
        }
      }
      @media (-webkit-max-device-pixel-ratio: 1), (max-resolution: 96dpi) {
        .reveal-wrap {
          width: 25vw;
          max-width: 325px;
          max-height: 597px;
        }
        .sun {
          width: 40vw;
          max-width: 600px;
        }
        .frame2-text1,
        .frame2-text2 {
          max-width: 620px;
        }
        #closeBtn {
          left: 17%;
        }
      }
      @media screen and (max-width: 767px) {
        .stage {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          z-index: 4;
          cursor: pointer;
          transform: unset;
        }
        .sun {
          max-width: 400px;
          width: 63vw;
        }
        .sun-screen-layer{
          left:-46px;
        }
        .reveal-stack {
          position: absolute;
          top: 18vh;
          left: 0;
          right: 0;
          margin: 0 auto;
          width: fit-content;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 3vw;
          z-index: 5;
        }
        .reveal-wrap {
          position: relative;
          width: 44vw;
          aspect-ratio: 260 / 478;
          cursor: pointer;
          opacity: 0;
          z-index: 4;
        }

        .reveal-wrap img {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
        }
        .frame1-text {
          position: relative;
          height: 6vw;
          width: auto;
          opacity: 0;
        }

        .frame1-cta {
          position: relative;
          width: 44vw;
          height: auto;
          opacity: 0;
        }
        .path-svg.mobile {
          position: fixed;
          display: block;
        }
        .path-svg.pc {
          display: none;
        }
        .frame2-text1,
        .frame2-text2 {
          position: absolute;
          width: 82vw;
          height: auto;
          left: 50%;
          transform: translateX(-50%);
          opacity: 0;
          bottom: 0;
          top: 64%;
        }

        #splash-container {
          width: 100vw;
          max-width: unset;
        }
        #catfish {
          position: fixed;
          bottom: 0;
          left: 0;
          width: 100vw;
          height: 170px;
          z-index: 1000;
          background: url(normal-bg.png) repeat-x bottom center / auto 130px;
          transform: translate(0, 100vh);
        }

        #catfishClick {
          position: absolute;
          inset: 0;
          z-index: 3;
        }

        #catfish .content {
          position: relative;
          width: 100%;
          height: 100%;
          display: block;
          padding: 0 2vw;
          z-index: 2;
        }

        #catfish .logo {
          position: absolute;
          width: 15vw;
          max-width: 55px;
          height: auto;
          top: 101px;
          margin-top: 0;
        }

        #catfish #weather {
          background: url(temp-m-bg.png) no-repeat center / 100% auto;
          aspect-ratio: 356 / 222;
          width: 32vw;
          max-width: 170px;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          position: absolute;
          left: 42%;
          top: 40px;
          margin: 0;
        }
        #catfish #weather img {
          width: 34%;
          height: auto;
          margin: 0 0 0 10%;
        }
        #catfish #weather div {
          color: #db8000;
          font-size: 28px;
          margin: 1% 0 0 10%;
          letter-spacing: -0.5px;
          white-space: nowrap;
        }
        #catfish #weather div sup {
          font-size: 14px;
        }
        #catfish #text {
          width: 41%;
          flex: 1;
          position: relative;
          height: 50px;
          top: 56px;
          padding-top: 0;
        }
        #catfish #text .text3 {
          top: 42px;
          left: 100px;
          margin: auto;
          left: 60%;
          width: 100%;
        }
        #catfish #text img {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: auto;
        }
        #catfish .catfishProdcut {
          position: absolute;
          width: auto;
          height: 100%;
          right: 10px;
          bottom: 0;
          padding: 0;
          margin: 0;
        }
        #closeBtn {
          position: absolute;
          top: 25px;
          left: 1vw;
          width: 30px;
          height: 30px;
          background: url(closebtn.png) no-repeat center / 22px 22px;
          z-index: 999;
          cursor: pointer;
        }
      }
      @media (min-width: 768px) and (max-width: 1000px) {
        #catfish .content {
          max-width: 740px;
        }
        #closeBtn {
          left: 2%;
        }
        #catfish .catfishProdcut {
          position: absolute;
          height: 100%;
          right: -20px;
        }
        #catfish #weather {
          width: 25%;
          margin-left: 0;
        }
        .stage {
          width: 100%;
          height: 100%;
        }
        .reveal-wrap {
          width: 36vw;
        }
        .frame2-text1,
        .frame2-text2 {
          position: absolute;
          width: 82vw;
          height: auto;
          left: 50%;
          transform: translateX(-50%);
          opacity: 0;
          bottom: 0;
          top: 64%;
        }
        .sun-screen-layer{
          top:-22vh;
          left:7vw;
        }
        .sun{
          width:430px;
        }
        #closeBtn {
          position: absolute;
          top: 47px;
          left: 1vw;
          width: 30px;
          height: 30px;
          background: url(closebtn.png) no-repeat center / 22px 22px;
          z-index: 999;
          cursor: pointer;
        }
      }
      @media (min-width:1024px) and (max-width:1100px){
          #closeBtn {
          left:2%;
        }
      }
      @keyframes floatX {
        0% {
          transform: translate(-10px, 10px);
        }
        100% {
          transform: translate(70px, 9px);
        }
      }
      @keyframes heatBlur {
        from {
          filter: url(#heatDistortion) blur(0px);
        }
        to {
          filter: url(#heatDistortion) blur(1.5px);
        }
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.flashtalking.com/frameworks/js/api/2/10/html5API.js"></script>
    <div class="bg-white"></div>
    <div class="bg"></div>
    <div class="heat"></div>
    <div class="wave">
      <img src="wave.png" style="width: 100%; height: 100%; z-index: 3; position: absolute; animation: heatBlur 10s infinite alternate; width: 100%; display: block; filter: url(#heatDistortion)" />
      <svg>
        <filter id="heatDistortion">
          <feTurbulence type="turbulence" baseFrequency="0.01 0.03" numOctaves="2" seed="2">
            <animate attributeName="baseFrequency" dur="30s" values="0.01 0.03;0.02 0.05;0.01 0.03" repeatCount="10" />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" scale="20" />
        </filter>
      </svg>
    </div>
    <div class="cloud"></div>
    <div class="stage">
      <div class="scene">
        <div id="frame1" class="frame-1">
          <img src="sun.png" class="sun" />
          <img src="flare.png" class="sun-screen-layer" />
          <svg class="path-svg" viewBox="0 0 1280 720">
            <path id="motionPathPc" d="M 0 700 Q 250 0 640 -30" />
          </svg>
          <svg class="path-svg" viewBox="0 0 720 1100" preserveAspectRatio="none">
            <path id="motionPathM" d="M -200 580 Q 20 0 350 70" />
          </svg>
          <div class="reveal-stack">
            <div class="reveal-wrap" id="revealBox">
              <img src="hide-product.png" class="hide-product cover" />
              <img src="product.png" class="real-img" />
            </div>
            <img src="frame1-text.png" class="frame1-text" />
            <img class="frame1-cta" src="frame1-tap.png" />
            <div id="splash-container"></div>
            <img src="frame2-text1.png" class="frame2-text1" />
            <img src="frame2-text2.png" class="frame2-text2" />
          </div>
        </div>
      </div>
    </div>
    <div id="closeBigBtn"></div>
    <div id="catfish">
      <div id="closeBtn"></div>
      <div id="catfishClick"></div>
      <div class="content">
        <img class="logo" src="logo.png" />
        <div id="weather">
          <img class="icon" src="weather-icon.png" />
          <div>30<sup>&#xb0;C</sup></div>
        </div>
        <div id="text">
          <img class="text1" src="catfish-text.png" />
          <img class="text2" src="normal-text.png" />
          <img class="text3" src="catfish-text2.png" />
        </div>

        <img class="catfishProdcut" src="catfish-product.png" />
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
